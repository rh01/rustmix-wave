[package]
name = "jpeg-decoder"
version = "0.3.2"
edition = "2021"
rust-version = "1.61.0"
license = "MIT OR Apache-2.0"
description = "JPEG decoder vendored so IDCT runs on the calling thread"
publish = false

[lib]
name = "jpeg_decoder"
path = "src/lib.rs"

[dependencies]
rayon = { version = "1.5.1", optional = true }

[features]
default = []
platform_independent = []
nightly_aarch64_neon = []
